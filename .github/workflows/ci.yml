name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  OPENSPEC_TELEMETRY: '0'

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mimir
          POSTGRES_PASSWORD: mimir
          POSTGRES_DB: mimir
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U mimir"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bunx playwright install --with-deps chromium --only-shell
        working-directory: e2e
      - run: bun run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
